name: Bug 报告
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全漏洞不要在这里报，见 SECURITY.md。
  - type: dropdown
    id: mode
    attributes:
      label: 运行模式
      options:
        - 本地模式（没有配置 VITE_CLOUD_*）
        - 云模式（手机号登录 + 同步）
        - 不确定
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 Network
        2. 鼠标靠近某个小点
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      placeholder: macOS 15 / Chrome 132 / Node 20
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 控制台报错或截图
      render: shell
    validations:
      required: false
