name: 功能建议
description: 提出一个改进或新能力
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是只给方案。
      placeholder: 当我有 8 个身份词时，Network 上……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 补充
      options:
        - label: 我愿意提 PR 实现这个想法
